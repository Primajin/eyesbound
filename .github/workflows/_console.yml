name: "CI · Console"

# Runs against the Cloudflare preview URL (`preview-url` from the `preview` job of ci.yml),
# and only once the repository variable PREVIEW_PROVIDER is set to cloudflare.

on:
  workflow_call:
    inputs:
      preview-url:
        description: Cloudflare preview URL
        type: string
        required: false
        default: ''

permissions: {}

jobs:
  console:
    # Same condition as the caller job in ci.yml.
    if: vars.PREVIEW_PROVIDER == 'cloudflare' && inputs.preview-url != ''
    runs-on: ubuntu-latest
    name: Get console logs
    permissions:
      pull-requests: write
    steps:
      - name: Wait for the Cloudflare preview to answer
        uses: Primajin/.github/actions/wait-for-url@e935eed2767688c725dc9dcbbbec1a3be4abf715 # v1.1.0
        with:
          url: ${{ inputs.preview-url }}/
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use WebApp Console Log Action
        uses: Primajin/webapp-console-log-action@94159a1a173934a0d47c6d9eecbbadf1852c7b6f # v2.0.0
        with:
          webapp-url: ${{ inputs.preview-url }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
