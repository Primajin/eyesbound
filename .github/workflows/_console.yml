name: "CI · Console"

# Preview source is switched by the repository variable PREVIEW_PROVIDER:
#   unset / netlify (default): wait for the Netlify deploy check (Gatsby era).
#   cloudflare: use `preview-url` from the `preview` job of ci.yml.

on:
  workflow_call:
    inputs:
      preview-url:
        description: Cloudflare preview URL (used only when PREVIEW_PROVIDER=cloudflare)
        type: string
        required: false
        default: ''

permissions: {}

jobs:
  console:
    # Same condition as the caller job in ci.yml.
    if: vars.PREVIEW_PROVIDER != 'cloudflare' || inputs.preview-url != ''
    runs-on: ubuntu-latest
    name: Get console logs
    permissions:
      pull-requests: write
    steps:
      - name: Wait for Pages changed to neutral
        if: vars.PREVIEW_PROVIDER != 'cloudflare'
        uses: fountainhead/action-wait-for-check@5a908a24814494009c4bb27c242ea38c93c593be # v1.2.0
        id: wait-for-Netlify
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          checkName: 'Pages changed - eyesbound'
      - name: Get Preview URL after Netlify check done
        if: vars.PREVIEW_PROVIDER != 'cloudflare' && steps.wait-for-Netlify.outputs.conclusion == 'neutral'
        uses: jakepartusch/wait-for-netlify-action@f1e137043864b9ab9034ae3a5adc1c108e3f1a48 # v1.4
        id: waitFor200
        with:
          site_name: 'eyesbound'
      - name: Wait for the Cloudflare preview to answer
        if: vars.PREVIEW_PROVIDER == 'cloudflare'
        env:
          PREVIEW_URL: ${{ inputs.preview-url }}
        run: curl --fail --silent --show-error --location --output /dev/null --retry 10 --retry-delay 3 --retry-all-errors "$PREVIEW_URL/"
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use WebApp Console Log Action
        uses: Primajin/webapp-console-log-action@94159a1a173934a0d47c6d9eecbbadf1852c7b6f # v2.0.0
        with:
          webapp-url: ${{ vars.PREVIEW_PROVIDER == 'cloudflare' && inputs.preview-url || steps.waitFor200.outputs.url }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
