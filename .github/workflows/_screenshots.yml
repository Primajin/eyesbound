name: "CI · Screenshots"

# Runs against the Cloudflare preview URL (`preview-url` from the `preview` job of ci.yml),
# and only once the repository variable PREVIEW_PROVIDER is set to cloudflare.

on:
  workflow_call:
    inputs:
      preview-url:
        description: Cloudflare preview URL
        type: string
        required: false
        default: ''

permissions: {}

jobs:
  screenshots:
    # Same condition as the caller job in ci.yml.
    if: vars.PREVIEW_PROVIDER == 'cloudflare' && inputs.preview-url != ''
    runs-on: ubuntu-latest
    name: Get screenshots of picture page
    permissions:
      contents: write # checkout, and screenshots-ci-action uploads the release assets
      pull-requests: write # screenshots-ci-action posts and edits the PR comment
    steps:
      - name: Wait for the Cloudflare preview to answer
        env:
          PREVIEW_URL: ${{ inputs.preview-url }}
        run: curl --fail --silent --show-error --location --output /dev/null --retry 10 --retry-delay 3 --retry-all-errors "$PREVIEW_URL/picture/"
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: screenshots-ci-action
        uses: Primajin/screenshots-ci-action@9042a4f85ea2cc2d18b7dfc787146b91690817e1 # v4.1.1
        with:
          url: ${{ inputs.preview-url }}/picture/
          release-id: 357373231
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: screenshots
          name: Download-screenshots
