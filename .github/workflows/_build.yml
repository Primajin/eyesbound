name: "CI · Build"

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Make sure it builds.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-
      - name: Install dependencies
        run: npm ci
      - name: Run build
        shell: bash
        # Gatsby's GraphQL data layer occasionally dies mid-build with
        # "Unexpected end of JSON input" / "Worker exited before finishing task".
        # Retry a few times, clearing the Gatsby cache between attempts.
        run: |
          for attempt in 1 2 3; do
            npm run build && exit 0
            echo "::warning::Gatsby build failed on attempt ${attempt}."
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Gatsby build failed after ${attempt} attempts."
              exit 1
            fi
            echo "Clearing Gatsby cache and retrying in 15s..."
            rm -rf .cache public
            sleep 15
          done
        env:
          GATSBY_API_KEY: ${{ secrets.GATSBY_API_KEY }}
          GATSBY_G_MAPS: ${{ secrets.GATSBY_G_MAPS }}
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
